[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
documentfile = "1.1.0"
pdfbox = "2.0.27.0"
pdfboxDesktop = "2.0.27"
tesseract = "4.9.0"
mlkit = "16.0.1"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTest = "1.7.0"
tess4j = "5.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# PDF: okuma, rasterize (sayfa -> resim) ve görünmez metin katmanı yazma
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
# OCR motoru 1: Tesseract 5.5.1 + Leptonica 1.85.0 (KillerPDF ile aynı motor)
tesseract4android = { group = "cz.adaptech.tesseract4android", name = "tesseract4android", version.ref = "tesseract" }
# OCR motoru 2: Google ML Kit (cihaz üstü)
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkit" }

# Test bağımlılıkları
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
# Yalnızca testte: döndürülmüş sayfa koordinatlarını gerçek PDF ile doğrulamak için
# masaüstü PDFBox (pdfbox-android 2.0.27.0 bu sürümün portudur; aynı davranış).
pdfbox-desktop = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfboxDesktop" }
# Yalnızca testte: gerçek Tesseract ile tablo okuma davranışını doğrulamak için
# (uygulamanın assets/tessdata modelleri kullanılır; yerel kütüphaneler paket içindedir).
tess4j = { group = "net.sourceforge.tess4j", name = "tess4j", version.ref = "tess4j" }

[plugins]
# AGP 9 yerleşik Kotlin içerir; org.jetbrains.kotlin.android eklentisi ARTIK KULLANILMAZ.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
